<svg xmlns="http://www.w3.org/2000/svg" width="860" height="214" viewBox="0 0 860 214" role="img" aria-label="Terminal: The best error message is the one that never shows up."><style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:13.5px}.z{clip-path:inset(0 100% 0 0);animation:tipp var(--d) steps(var(--n)) forwards;animation-delay:var(--v)}@keyframes tipp{to{clip-path:inset(0 0 0 0)}}.k{animation:blink 1s step-end infinite}@keyframes blink{50%{opacity:0}}</style><rect x=".5" y=".5" width="859" height="213" rx="9" fill="#0d1117" stroke="#3d444d"/><path d="M.5 30V9.5a9 9 0 0 1 9-9h841a9 9 0 0 1 9 9V30z" fill="#161b22"/><circle cx="20" cy="15" r="5.5" fill="#ff5f57"/><circle cx="38" cy="15" r="5.5" fill="#febc2e"/><circle cx="56" cy="15" r="5.5" fill="#28c840"/><text x="430.0" y="19.5" text-anchor="middle" fill="#9198a1" style="font-size:12px">jonas@homelab: ~</text><g class="z" style="--n:8;--d:0.24s;--v:0.30s"><text x="20" y="56" fill="#3fb950" xml:space="preserve">$ <tspan fill="#e6edf3">whoami</tspan></text></g><g class="z" style="--n:58;--d:0.70s;--v:0.89s"><text x="20" y="80" fill="#e6edf3" xml:space="preserve"><tspan fill="#e6edf3">jonas: homelab builder, Go + React developer, photographer</tspan></text></g><g class="z" style="--n:8;--d:0.24s;--v:2.09s"><text x="20" y="104" fill="#3fb950" xml:space="preserve">$ <tspan fill="#e6edf3">uptime</tspan></text></g><g class="z" style="--n:51;--d:0.61s;--v:2.68s"><text x="20" y="128" fill="#e6edf3" xml:space="preserve"><tspan fill="#e6edf3">self-hosted everything, clouds used: 0, coffee: yes</tspan></text></g><g class="z" style="--n:9;--d:0.27s;--v:3.79s"><text x="20" y="152" fill="#3fb950" xml:space="preserve">$ <tspan fill="#e6edf3">fortune</tspan></text></g><g class="z" style="--n:54;--d:0.65s;--v:4.41s"><text x="20" y="176" fill="#f97316" xml:space="preserve"><tspan fill="#f97316">The best error message is the one that never shows up.</tspan></text></g><text x="20" y